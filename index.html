<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kühlschrank Magnet Spiel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="main-container">
        <!-- Navigation -->
        <div class="navbar">
            <div class="nav-items">
                <button class="nav-btn active" data-tab="game">🎮 Spiel</button>
                <button class="nav-btn" data-tab="market">💰 Markt</button>
                <button class="nav-btn" data-tab="inventory">🧲 Mein Lager</button>
                <button class="nav-btn" data-tab="skins">🎨 Kühlschränke</button>
            </div>
            <div class="wallet">
                Geld: <span id="money">1000</span>€
            </div>
        </div>

        <!-- Game Tab -->
        <div class="tab-content active" id="game-tab">
            <div class="container">
                <h1>Kühlschrank Magnet Spiel</h1>
                <canvas id="gameCanvas" width="1000" height="600"></canvas>
                <div class="controls">
                    <button id="toggleDoor">🚪 Tür öffnen/schließen</button>
                    <button id="addMagnet">➕ Magnet hinzufügen</button>
                    <button id="uploadImage" style="display: none;">Bild hochladen</button>
                    <input type="file" id="imageUpload" accept="image/*" style="display: none;">
                </div>
            </div>
        </div>

        <!-- Market Tab -->
        <div class="tab-content" id="market-tab">
            <div class="container">
                <h1>Marktplatz - Magnete kaufen/verkaufen</h1>
                <div class="market-grid" id="marketGrid"></div>
            </div>
        </div>

        <!-- Inventory Tab -->
        <div class="tab-content" id="inventory-tab">
            <div class="container">
                <h1>Mein Lager</h1>
                <div class="inventory-stats">
                    <div class="stat">
                        <span>Gesamte Magnete:</span>
                        <span id="totalMagnets">0</span>
                    </div>
                    <div class="stat">
                        <span>Unterschiedliche Serien:</span>
                        <span id="totalSeries">0</span>
                    </div>
                </div>
                <div class="inventory-grid" id="inventoryGrid"></div>
            </div>
        </div>

        <!-- Skins Tab -->
        <div class="tab-content" id="skins-tab">
            <div class="container">
                <h1>Kühlschrank Skins</h1>
                <div class="skins-grid" id="skinsGrid"></div>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
