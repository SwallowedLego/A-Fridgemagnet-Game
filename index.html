<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kühlschrank Magnet Spiel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Kühlschrank Magnet Spiel</h1>
        <canvas id="gameCanvas" width="1000" height="700"></canvas>
        <div class="controls">
            <button id="toggleDoor">Tür öffnen/schließen</button>
            <button id="addMagnet">Magnet hinzufügen</button>
            <input type="file" id="imageUpload" accept="image/*" style="display: none;">
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
